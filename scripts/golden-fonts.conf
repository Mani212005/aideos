<!--
File Description: Pin the Linux golden renderer to CI's RGB subpixel text rendering.
Inputs and outputs: system font configuration -> the same fonts with deterministic RGB rasterization.
Used by: scripts/ci.ts, for the Linux legacy golden job only.
-->
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <include ignore_missing="yes">/etc/fonts/fonts.conf</include>
  <match target="pattern">
    <edit name="rgba" mode="assign"><const>rgb</const></edit>
  </match>
</fontconfig>
