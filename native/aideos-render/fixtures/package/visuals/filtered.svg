<!--
  File Description: Synthetic test artwork that uses an SVG filter primitive outside the drawn subset (feTurbulence, the noise of the paper-fibers texture), which the native renderer refuses rather than drawing the asset without it.
  Inputs and outputs: none -> static SVG the renderer must reject at load.
  Used by: native/aideos-render/tests/render.rs.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-50 -50 100 100">
  <defs>
    <filter id="grain"><feTurbulence type="fractalNoise" baseFrequency="0.04" numOctaves="4"/></filter>
  </defs>
  <circle id="blob" r="30" fill="#635BFF" filter="url(#grain)"/>
</svg>
