# File Description: Cargo workspace for the native renderer crates (Render IR loader, evaluator and raster, and encode/audio mux).
# Inputs and outputs: member crate manifests -> one lockfile, one target directory (native/target, gitignored).
# Used by: cargo build/test run from native/, the CI native job, docs/RENDER_IR.md.
[workspace]
members = ["aideos-render-ir", "aideos-render", "aideos-encode"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
rust-version = "1.85"
