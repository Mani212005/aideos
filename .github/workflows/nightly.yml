# File Description: Nightly heavier render of the Iona fixture film, wide and reel, with budgets on wall time, peak memory, temp disk and bundle size; runs on a schedule and on demand, never on pull requests.
# Inputs and outputs: a cron schedule or a manual run (optional toolchain input), the AIDEOS_TOOLCHAIN repository variable -> a budget table in the job summary and the report as an artifact.
# Used by: GitHub Actions. Documented in docs/CI.md.
name: Nightly render budget

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      toolchain:
        description: "JavaScript toolchain for this run: bun (the default path) or npm (see scripts/toolchain.ts)"
        type: choice
        options: [bun, npm]
        default: bun

permissions:
  contents: read

env:
  CI: "true"
  AIDEOS_GL: swangle
  # The one switch (scripts/toolchain.ts), read the same way as in ci.yml: a manual run's input, else the repository
  # variable AIDEOS_TOOLCHAIN, else bun.
  AIDEOS_TOOLCHAIN: ${{ inputs.toolchain || vars.AIDEOS_TOOLCHAIN || 'bun' }}

jobs:
  render-budget:
    name: render-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The npm download cache serves only the npm path's `npm ci`; the bun path caches node_modules itself.
          cache: ${{ env.AIDEOS_TOOLCHAIN == 'npm' && 'npm' || '' }}
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.apt-cache
          key: apt-cache-nightly-${{ runner.os }}-${{ hashFiles('.github/workflows/nightly.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-
      - name: Install ffmpeg and browser libraries
        timeout-minutes: 10
        uses: ./.github/actions/setup-apt
        with:
          packages: ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = npm ]; then
            npx remotion browser ensure
          else
            bun x --no-install remotion browser ensure
          fi
      - name: Render within budget
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = npm ]; then
            npx tsx scripts/ci.ts nightly
          else
            bun scripts/ci.ts nightly
          fi
      - name: Keep the budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-budget
          path: .ci-artifacts/nightly
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
