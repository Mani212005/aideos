# File Description: Nightly heavier render of the Iona fixture film, wide and reel, with budgets on wall time, peak memory, temp disk and bundle size; runs on a schedule and on demand, never on pull requests.
# Inputs and outputs: a cron schedule or a manual run -> a budget table in the job summary and the report as an artifact.
# Used by: GitHub Actions. Documented in docs/CI.md.
name: Nightly render budget

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: "true"
  AIDEOS_GL: swangle

jobs:
  render-budget:
    name: render-budget
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.apt-cache
          key: apt-cache-nightly-${{ runner.os }}-${{ hashFiles('.github/workflows/nightly.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-
      - name: Install ffmpeg and browser libraries
        timeout-minutes: 10
        run: |
          mkdir -p /home/runner/.apt-cache/partial
          sudo rm -f /etc/apt/apt.conf.d/docker-clean
          if [ -f /etc/apt/apt-mirrors.txt ] && grep -q '^http://azure.archive.ubuntu.com/ubuntu/' /etc/apt/apt-mirrors.txt; then
            if ! grep -qE '^http://azure\.archive\.ubuntu\.com/ubuntu/?[[:space:]]+priority:' /etc/apt/apt-mirrors.txt; then
              sudo sed -i -E '/^http:\/\/azure\.archive\.ubuntu\.com\/ubuntu\/?([[:space:]]|$)/ s/[[:space:]]*$/\tpriority:1/' /etc/apt/apt-mirrors.txt
            fi
            if ! grep -qE '^http://archive\.ubuntu\.com/ubuntu/?([[:space:]]|$)' /etc/apt/apt-mirrors.txt; then
              printf 'http://archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee -a /etc/apt/apt-mirrors.txt >/dev/null
            fi
          fi
          for attempt in 1 2 3; do
            if timeout 80 sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 update && \
               timeout 80 sudo apt-get -o Acquire::http::Timeout=20 -o Acquire::https::Timeout=20 -o Acquire::Retries=3 -o Dir::Cache::Archives=/home/runner/.apt-cache install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt install failed after 3 attempts" >&2
              exit 1
            fi
            delay=$((attempt * 20))
            echo "apt attempt $attempt failed; sleeping ${delay}s before retry"
            sleep "$delay"
          done
      - name: Install dependencies
        run: npm ci
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: npx remotion browser ensure
      - name: Render within budget
        run: npm run ci -- nightly
      - name: Keep the budget report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-budget
          path: .ci-artifacts/nightly
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
