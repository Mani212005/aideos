# File Description: Pull request and main CI. A first changes job classifies changed files in shadow mode, four parallel jobs (static, unit, journeys, legacy) each run one `npm run ci -- <job>`, and a final all-green job gives branch protection a single check to require.
# Inputs and outputs: pull requests, pushes to main, manual runs -> changed files analysis, job results, a timing table in each job summary, failing frames and reports as artifacts.
# Used by: GitHub Actions. Documented in docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request supersedes the older run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  # Software GL gives identical pixels on every runner, which is what makes 3D frames comparable.
  AIDEOS_GL: swangle
  RUFF_VERSION: "0.17.0"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      journeys: ${{ steps.classify.outputs.journeys }}
      legacy: ${{ steps.classify.outputs.legacy }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ciChanges.mjs

  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ruff
        run: pipx install "ruff==${RUFF_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run ci -- static

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update && \
               timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt install failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt attempt $attempt failed; sleeping 15s before retry"
            sleep 15
          done
      - name: Install dependencies
        run: npm ci
      - name: Unit and feature tests
        run: npm run ci -- unit

  journeys:
    name: journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg and browser libraries
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update && \
               timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt install failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt attempt $attempt failed; sleeping 15s before retry"
            sleep 15
          done
      - name: Install dependencies
        run: npm ci
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: npx remotion browser ensure
      - name: Journeys
        run: npm run ci -- journeys
      - name: Keep failing frames and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-evidence
          path: .ci-artifacts
          if-no-files-found: ignore
          retention-days: 14

  legacy:
    name: legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg and browser libraries
        timeout-minutes: 10
        run: |
          for attempt in 1 2 3; do
            if timeout 300 sudo apt-get -o Acquire::Retries=3 update && \
               timeout 300 sudo apt-get -o Acquire::Retries=3 install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "apt install failed after 3 attempts" >&2
              exit 1
            fi
            echo "apt attempt $attempt failed; sleeping 15s before retry"
            sleep 15
          done
      - name: Install dependencies
        run: npm ci
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: npx remotion browser ensure
      - name: Golden frames
        run: npm run ci -- legacy
      - name: Keep candidate and failing frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-evidence
          path: .ci-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # One name for branch protection to require: it fails if any job above failed, was cancelled or was skipped.
  all-green:
    name: all-green
    if: always()
    needs: [changes, static, unit, journeys, legacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.journeys.result }} ${{ needs.legacy.result }}
        run: |
          echo "changes static unit journeys legacy: ${RESULTS}"
          test "${RESULTS}" = "success success success success success"
