# File Description: Pull request and main CI. Four parallel jobs (static, unit, journeys, legacy) each run one `npm run ci -- <job>`, so the commands live in scripts/ci.ts and run identically on a laptop; a final all-green job gives branch protection a single check to require.
# Inputs and outputs: pull requests, pushes to main, manual runs -> job results, a timing table in each job summary, failing frames and reports as artifacts.
# Used by: GitHub Actions. Documented in docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same pull request supersedes the older run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  # Software GL gives identical pixels on every runner, which is what makes 3D frames comparable.
  AIDEOS_GL: swangle
  RUFF_VERSION: "0.17.0"

jobs:
  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ruff
        run: pipx install "ruff==${RUFF_VERSION}"
      - name: Install dependencies
        run: npm ci
      - name: Static checks
        run: npm run ci -- static

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install dependencies
        run: npm ci
      - name: Unit and feature tests
        run: npm run ci -- unit

  journeys:
    name: journeys
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg and browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install dependencies
        run: npm ci
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: npx remotion browser ensure
      - name: Journeys
        run: npm run ci -- journeys
      - name: Keep failing frames and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-evidence
          path: .ci-artifacts
          if-no-files-found: ignore
          retention-days: 14

  legacy:
    name: legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg and browser libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install dependencies
        run: npm ci
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: npx remotion browser ensure
      - name: Golden frames
        run: npm run ci -- legacy
      - name: Keep candidate and failing frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-evidence
          path: .ci-artifacts
          if-no-files-found: ignore
          retention-days: 14

  # One name for branch protection to require: it fails if any job above failed, was cancelled or was skipped.
  all-green:
    name: all-green
    if: always()
    needs: [static, unit, journeys, legacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.journeys.result }} ${{ needs.legacy.result }}
        run: |
          echo "static unit journeys legacy: ${RESULTS}"
          test "${RESULTS}" = "success success success success"
