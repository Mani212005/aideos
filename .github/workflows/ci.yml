# File Description: Pull request and main CI. A first changes job classifies changed files in shadow mode, four parallel jobs (static, unit, journeys, legacy) each run one `npm run ci -- <job>` (journeys as three parallel shards), and a final all-green job gives branch protection a single check to require. AIDEOS_TOOLCHAIN picks npm (the default) or bun for every job (scripts/toolchain.ts): a manual run's `toolchain` input, else the repository variable AIDEOS_TOOLCHAIN, else npm.
# Inputs and outputs: pull requests, pushes to main, manual runs (optional toolchain input), the AIDEOS_TOOLCHAIN repository variable -> changed files analysis, job results, a timing table in each job summary, failing frames and reports as artifacts.
# Used by: GitHub Actions. Documented in docs/CI.md.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      toolchain:
        description: "JavaScript toolchain for this run: npm (the default path) or bun (see scripts/toolchain.ts)"
        type: choice
        options: [npm, bun]
        default: npm

# A newer push to the same pull request supersedes the older run; main runs are never cancelled.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  CI: "true"
  # Software GL gives identical pixels on every runner, which is what makes 3D frames comparable.
  AIDEOS_GL: swangle
  RUFF_VERSION: "0.17.0"
  # The one switch (scripts/toolchain.ts). Flip every run to bun by setting the repository variable AIDEOS_TOOLCHAIN=bun;
  # delete it (or set npm) to restore npm. A manual run's input wins for that run only.
  AIDEOS_TOOLCHAIN: ${{ inputs.toolchain || vars.AIDEOS_TOOLCHAIN || 'npm' }}

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      journeys: ${{ steps.classify.outputs.journeys }}
      legacy: ${{ steps.classify.outputs.legacy }}
      risk: ${{ steps.classify.outputs.risk }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22
      - name: Classify changed files
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/ciChanges.mjs

  static:
    name: static
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ruff
        run: pipx install "ruff==${RUFF_VERSION}"
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Static checks
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun scripts/ci.ts static
          else
            npm run ci -- static
          fi

  unit:
    name: unit
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.apt-cache
          key: apt-cache-unit-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-
      - name: Install ffmpeg and tesseract
        timeout-minutes: 10
        uses: ./.github/actions/setup-apt
        with:
          packages: ffmpeg tesseract-ocr
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun x --no-install remotion browser ensure
          else
            npx remotion browser ensure
          fi
      - name: Restore the Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-native-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Unit and feature tests
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun scripts/ci.ts unit
          else
            npm run ci -- unit
          fi

  # The journeys run as parallel shards: each leg runs a disjoint, deterministic share of the journey files
  # (scripts/ciJourneyShards.ts), and `needs.journeys.result` below is the aggregate of every leg. fail-fast is off
  # so a failing shard never cancels the others and every shard keeps its own evidence.
  journeys:
    name: journeys (shard ${{ matrix.shard }}/${{ strategy.job-total }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.apt-cache
          key: apt-cache-journeys-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-
      - name: Install ffmpeg, tesseract and browser libraries
        timeout-minutes: 10
        uses: ./.github/actions/setup-apt
        with:
          packages: ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2 tesseract-ocr
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun x --no-install remotion browser ensure
          else
            npx remotion browser ensure
          fi
      # The render jobs of the journeys draw every film the native renderer supports (the one-performer Three-stage
      # films since P4.2) with the release binary; without it they would fall back to Remotion.
      - name: Restore the Rust build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            native/target
          key: cargo-native-release-${{ runner.os }}-${{ hashFiles('native/Cargo.lock') }}
      - name: Build the native renderer
        run: cargo build --locked --release --manifest-path native/Cargo.toml -p aideos-render
      # Includes the character and Three-stage suites selected by backend/journeys/**/*.journey.ts.
      - name: Journeys
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun scripts/ci.ts journeys --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          else
            npm run ci -- journeys --shard ${{ matrix.shard }}/${{ strategy.job-total }}
          fi
      - name: Keep failing frames and reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: journeys-evidence-${{ matrix.shard }}
          path: .ci-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  legacy:
    name: legacy
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Restore apt cache
        uses: actions/cache@v4
        with:
          path: /home/runner/.apt-cache
          key: apt-cache-legacy-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}
          restore-keys: |
            apt-cache-${{ runner.os }}-
      - name: Install ffmpeg, tesseract and browser libraries
        timeout-minutes: 10
        uses: ./.github/actions/setup-apt
        with:
          packages: ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Restore the Remotion browser
        id: remotion-browser
        uses: actions/cache@v4
        with:
          path: node_modules/.remotion
          key: remotion-browser-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Download the Remotion browser
        if: steps.remotion-browser.outputs.cache-hit != 'true'
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun x --no-install remotion browser ensure
          else
            npx remotion browser ensure
          fi
      - name: Golden frames
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = bun ]; then
            bun scripts/ci.ts legacy
          else
            npm run ci -- legacy
          fi
      - name: Keep candidate and failing frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-evidence
          path: .ci-artifacts
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  # One name for branch protection to require: it fails if any job above failed, was cancelled or was skipped.
  # The journeys result is the aggregate of every shard: any failed or cancelled shard makes it non-success.
  all-green:
    name: all-green
    if: always()
    needs: [changes, static, unit, journeys, legacy]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Require every job to have passed
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.static.result }} ${{ needs.unit.result }} ${{ needs.journeys.result }} ${{ needs.legacy.result }}
        run: |
          echo "changes static unit journeys legacy: ${RESULTS}"
          test "${RESULTS}" = "success success success success success"
