# File Description: Regenerates legacy golden frames on reviewed default-branch code and opens a pull request with the results.
# Inputs and outputs: a manual dispatch on the default branch (optional toolchain input), the AIDEOS_TOOLCHAIN repository variable -> generated backend/journeys/goldens/ artifact and a pull request.
# Used by: GitHub Actions. Documented in docs/CI.md.
name: Update goldens

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "JavaScript toolchain for this run: bun (the default path) or npm (see scripts/toolchain.ts)"
        type: choice
        options: [bun, npm]
        default: bun

permissions:
  contents: read

env:
  CI: "true"
  AIDEOS_GL: swangle
  # The one switch (scripts/toolchain.ts), read the same way as in ci.yml: a manual run's input, else the repository
  # variable AIDEOS_TOOLCHAIN, else bun.
  AIDEOS_TOOLCHAIN: ${{ inputs.toolchain || vars.AIDEOS_TOOLCHAIN || 'bun' }}

jobs:
  generate:
    name: generate-goldens
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - name: Require the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          REF_NAME: ${{ github.ref_name }}
        run: test "$REF_NAME" = "$DEFAULT_BRANCH"
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The npm download cache serves only the npm path's `npm ci`; the bun path caches node_modules itself.
          cache: ${{ env.AIDEOS_TOOLCHAIN == 'npm' && 'npm' || '' }}
          cache-dependency-path: |
            package-lock.json
            editor/package-lock.json
      - name: Install ffmpeg and browser libraries
        timeout-minutes: 10
        uses: ./.github/actions/setup-apt
        with:
          packages: ffmpeg libnss3 libdbus-1-3 libatk1.0-0 libgbm-dev libasound2t64 libxrandr2 libxkbcommon-dev libxfixes3 libxcomposite1 libxdamage1 libatk-bridge2.0-0 libpango-1.0-0 libcairo2 libcups2
      - name: Install dependencies
        uses: ./.github/actions/install-dependencies
      - name: Download the Remotion browser
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = npm ]; then
            npx remotion browser ensure
          else
            bun x --no-install remotion browser ensure
          fi
      # The same test files and fixture preload on either toolchain; `goldens:update` is the bun form.
      - name: Render the goldens (twice, to prove this platform reproduces them)
        run: |
          if [ "$AIDEOS_TOOLCHAIN" = npm ]; then
            npx tsx scripts/ensure_generated.ts
            AIDEOS_GOLDEN_UPDATE=1 node --import tsx --import ./backend/testSupport/fixtureVideosDir.ts --test --test-concurrency=1 "backend/journeys/**/*.golden.ts"
          else
            bun run goldens:update
          fi
      - name: Upload generated goldens
        uses: actions/upload-artifact@v4
        with:
          name: generated-goldens
          path: backend/journeys/goldens/
          if-no-files-found: error

  propose:
    name: propose-goldens
    needs: generate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/download-artifact@v4
        with:
          name: generated-goldens
          path: backend/journeys/goldens
      - name: Open a pull request with the generated frames
        uses: peter-evans/create-pull-request@v7
        with:
          branch: automation/update-goldens
          delete-branch: true
          add-paths: backend/journeys/goldens/
          commit-message: "test: regenerate golden frames on the CI platform"
          title: "test: regenerate legacy golden frames"
          body: "Generated twice on Linux with software GL. Review the PNGs before merging."
