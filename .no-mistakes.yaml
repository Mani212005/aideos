# File Description: Per-repo no-mistakes configuration defining test and lint verification gates; both delegate to scripts/ci.ts so the local gate runs exactly the commands CI runs.
# Inputs and outputs: repository source -> test and lint exit codes.
# Used by: no-mistakes CLI during automated verification runs.
commands:
  test: '(test -d node_modules || npm ci) && npm run ci -- unit journeys'
  lint: '(test -d node_modules || npm ci) && (test -d editor/node_modules || npm --prefix editor ci) && npm run ci -- static'
