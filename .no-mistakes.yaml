# Per-repo no-mistakes configuration for Aideos
commands:
  test: '(test -d node_modules || npm ci) && npm test && npm run validate && npm run smoke:studio'
  lint: '(test -d node_modules || npm ci) && npx tsc --noEmit && (test -d editor/node_modules || npm --prefix editor ci) && npx tsc --noEmit -p editor/tsconfig.app.json'
