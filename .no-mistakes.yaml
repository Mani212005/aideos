# File Description: Per-repo no-mistakes configuration defining test and lint verification gates.
# Inputs and outputs: repository source -> test and lint exit codes.
# Used by: no-mistakes CLI during automated verification runs.
commands:
  test: '(test -d node_modules || npm ci) && npm test && npm run validate && npm run smoke:studio'
  lint: '(test -d node_modules || npm ci) && npx tsx scripts/check_headers.ts && npx tsc --noEmit && (test -d editor/node_modules || npm --prefix editor ci) && npx tsc --noEmit -p editor/tsconfig.app.json && npm --prefix editor run build'
