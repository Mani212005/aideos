# File Description: Per-repo no-mistakes configuration defining the lint verification gate; delegates to scripts/ci.ts so the local gate runs exactly the commands CI runs.
# Inputs and outputs: repository source -> lint exit code.
# Used by: no-mistakes CLI during automated verification runs.
commands:
  lint: '(test -d node_modules || npm ci) && (test -d editor/node_modules || npm --prefix editor ci) && npm run ci -- static'
