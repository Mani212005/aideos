<!--
  File Description: The craft: the protagonist, on screen in every shot of the film.
  Static artwork for the film Still Talking. Nothing here animates itself: element ids are the
  handles that videos/still-talking/film.json drives through the declarative SVG timeline.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="-300 -200 600 400" preserveAspectRatio="xMidYMid meet">
  <g id="signal-group">
    <line id="signal-thread" x1="-32" y1="-1" x2="-660" y2="80" stroke="#635BFF" stroke-width="1.5" opacity="0.5" />
    <circle id="signal-pulse-1" cx="-32" cy="-1" r="3.6" fill="#635BFF" opacity="0" />
    <circle id="signal-pulse-2" cx="-32" cy="-1" r="3.6" fill="#635BFF" opacity="0" />
    <circle id="signal-pulse-3" cx="-32" cy="-1" r="3.6" fill="#635BFF" opacity="0" />
  </g>
  <g id="probe-body">
    <g id="probe-boom-mag">
      <line x1="18" y1="-14" x2="156" y2="-74" stroke="#F5F5F5" stroke-width="1.3" opacity="0.8" />
      <circle id="lamp-mag-1" cx="156" cy="-74" r="3.4" fill="#F5F5F5" />
    </g>
    <g id="probe-boom-sci">
      <line x1="26" y1="6" x2="104" y2="52" stroke="#F5F5F5" stroke-width="1.6" opacity="0.85" />
      <rect x="58" y="20" width="17" height="13" rx="2" fill="#141416" stroke="#F5F5F5" stroke-width="1.2" />
      <circle id="lamp-sci-1" cx="54.08" cy="22.56" r="3.4" fill="#F5F5F5" />
      <circle id="lamp-sci-2" cx="75.92" cy="35.44" r="3.4" fill="#F5F5F5" />
      <circle id="lamp-sci-3" cx="97.76" cy="48.32" r="3.4" fill="#F5F5F5" />
    </g>
    <g id="probe-rtg">
      <line x1="6" y1="14" x2="-30" y2="66" stroke="#F5F5F5" stroke-width="1.5" opacity="0.85" />
      <rect id="rtg-1" x="-9" y="25" width="14" height="10" rx="2" transform="rotate(52 -2 30)" fill="#141416" stroke="#F5F5F5" stroke-width="1.2" />
      <rect id="rtg-2" x="-22" y="42" width="14" height="10" rx="2" transform="rotate(52 -15 47)" fill="#141416" stroke="#F5F5F5" stroke-width="1.2" />
      <rect id="rtg-3" x="-35" y="59" width="14" height="10" rx="2" transform="rotate(52 -28 64)" fill="#141416" stroke="#F5F5F5" stroke-width="1.2" />
      <circle id="rtg-glow" cx="-16" cy="48" r="21" fill="none" stroke="rgba(99, 91, 255, 0.320)" stroke-width="1.4" />
    </g>
    <g id="probe-bus">
      <path d="M 3 -17 L 21 -17 L 28 -7 L 28 7 L 21 17 L 3 17 Z" fill="#141416" stroke="#F5F5F5" stroke-width="1.7" />
      <line x1="3" y1="-4" x2="28" y2="-4" stroke="rgba(245, 245, 245, 0.300)" stroke-width="1" />
      <circle id="lamp-radio" cx="14" cy="8" r="3.4" fill="#635BFF" />
    </g>
    <g id="probe-record">
      <circle cx="22" cy="24" r="9.5" fill="#141416" stroke="#F5F5F5" stroke-width="1.3" />
      <circle cx="22" cy="24" r="5" fill="none" stroke="rgba(245, 245, 245, 0.400)" stroke-width="0.9" />
      <circle id="record-glint" cx="22" cy="24" r="2" fill="#F5F5F5" opacity="0.9" />
    </g>
    <g id="probe-dish">
      <path id="dish-face" d="M 0 -52 Q -68 0 0 52 Z" fill="#141416" stroke="#F5F5F5" stroke-width="1.9" />
      <path id="dish-inner" d="M 0 -33 Q -43 0 0 33" fill="none" stroke="rgba(245, 245, 245, 0.340)" stroke-width="1.1" />
      <line id="dish-strut-a" x1="0" y1="-38" x2="-32" y2="-1" stroke="rgba(245, 245, 245, 0.300)" stroke-width="1" />
      <line id="dish-strut-b" x1="0" y1="38" x2="-32" y2="-1" stroke="rgba(245, 245, 245, 0.300)" stroke-width="1" />
      <circle id="dish-feed" cx="-32" cy="-1" r="4.2" fill="#F5F5F5" />
    </g>
  </g>
</svg>
