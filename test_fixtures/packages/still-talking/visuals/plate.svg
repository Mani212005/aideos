      <stop offset="42%" stop-color="#F5F5F5" stop-opacity="0.2" />
      <stop offset="72%" stop-color="#F5F5F5" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity="0" />
    </linearGradient>
  </defs>
  <g id="plate-body">
