<svg xmlns="http://www.w3.org/2000/svg" viewBox="-120 -220 240 240" width="240" height="240">
  <!-- Standalone turbine prop: a mast, a hub, and one rotating 3-blade sub-group (D1). -->
  <rect x="-4" y="-180" width="8" height="180" fill="#8A8A8E" />
  <circle cx="0" cy="0" r="35" fill="#101013" stroke="#F5F5F5" stroke-width="4" />
  <circle cx="0" cy="0" r="14" fill="#635BFF" />
  <g id="wheel-front">
    <path d="M0 -15 L15 -70 Q0 -90 -15 -70 Z" fill="#635BFF" stroke="#F5F5F5" stroke-width="2" />
    <path d="M0 -15 L15 -70 Q0 -90 -15 -70 Z" transform="rotate(120)" fill="#635BFF" stroke="#F5F5F5" stroke-width="2" />
    <path d="M0 -15 L15 -70 Q0 -90 -15 -70 Z" transform="rotate(240)" fill="#635BFF" stroke="#F5F5F5" stroke-width="2" />
  </g>
</svg>
